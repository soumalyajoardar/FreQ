<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Restrict the renderer to its own bundle plus the media/CDN endpoints it
         legitimately needs. No remote scripts, no eval, no arbitrary plugins. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: file: https:; media-src 'self' data: blob: file: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss: ws:; object-src 'none'; base-uri 'self'; form-action 'none';"
    />
    <title>FreQ Desktop</title>
    <link rel="icon" type="image/png" href="./freq-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
